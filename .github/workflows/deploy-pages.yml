name: Deploy game to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/node_modules/three/build _site/node_modules/qrcode-generator/dist _site/controller
          cp index.html style.css app.js game.js animation.js scene.js landscape.js sound.js network.js _site/
          cp controller/index.html controller/controller.js controller/controller.css controller/manifest.webmanifest controller/sw.js controller/icon.svg _site/controller/
          cp node_modules/three/build/three.module.js node_modules/three/build/three.core.js _site/node_modules/three/build/
          cp node_modules/three/LICENSE _site/node_modules/three/LICENSE
          cp node_modules/qrcode-generator/dist/qrcode.mjs _site/node_modules/qrcode-generator/dist/
          cp backend/THIRD_PARTY_NOTICES.txt _site/THIRD_PARTY_NOTICES.txt
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
