server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.tomcat.max-connections=1000
server.tomcat.threads.max=80
spring.web.resources.add-mappings=false
broker.asset-root=${GAME_ASSET_ROOT:C:/dev/tictactoe}
broker.allowed-origins=${GAME_ALLOWED_ORIGINS:}
broker.max-rooms=${GAME_MAX_ROOMS:500}
broker.idle-minutes=${GAME_IDLE_MINUTES:120}
broker.host-away-minutes=${GAME_HOST_AWAY_MINUTES:15}
broker.absolute-hours=${GAME_ABSOLUTE_HOURS:24}
server.error.include-message=never
